<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>曲目管理</title><link rel="stylesheet" href="style.css"></head><body><div class="bg"></div><main><header><div><small>WONGMING EMPIRE</small><h1>曲目管理</h1></div><a href="index.html">返回</a></header><section style="margin-top:20px;background:#090302e8;border:1px solid #b9985566;padding:22px"><label>曲名</label><input id="t" placeholder="例如：天命所歸典禮曲"><label>演出者／分類</label><input id="a" value=""><label>YouTube 網址</label><input id="u" placeholder="https://www.youtube.com/watch?v=..."><button id="add">加入曲目</button><button id="reset">恢復預設</button><p class="note" style="text-align:left"></p><hr><div id="list"></div></section></main><script>const D=[
  {"title":"天命所歸典禮曲","artist":"黃名音樂廳","youtube":"https://www.youtube.com/watch?v=nJFxOGmXo3k"}
];let s=[];function load(){try{s=JSON.parse(localStorage.getItem("wongmingMusicHallSongs"))||D}catch{s=D}}function save(){localStorage.setItem("wongmingMusicHallSongs",JSON.stringify(s));render()}function render(){list.innerHTML=s.map((x,i)=>'<div style="padding:12px;border-bottom:1px solid #b9985533"><b>'+x.title+'</b><br><small>'+x.youtube+'</small> <button onclick="s.splice('+i+',1);save()">刪除</button></div>').join("")}add.onclick=()=>{if(!t.value.trim()||!u.value.trim())return alert("請填寫曲名與 YouTube 網址");s.push({title:t.value.trim(),artist:a.value.trim()||"",youtube:u.value.trim()});save();t.value="";u.value=""};reset.onclick=()=>{s=[...D];save()};load();render()</script></body></html>
