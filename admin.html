<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>曲目管理｜皇家音樂廳</title><link rel="stylesheet" href="style.css"><style>.lock{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(4,1,0,.78);backdrop-filter:blur(8px)}.lock-box{width:min(420px,90vw);padding:30px;background:#100604ed;border:1px solid #e2c17b66;box-shadow:0 0 55px #000;color:#f5ead4;text-align:center}.lock-box h2{margin:0 0 18px;font-weight:400}.lock-box input{width:100%;padding:12px;background:#080302;border:1px solid #e2c17b55;color:#fff;margin-bottom:12px}.lock-box button,.panel button{padding:9px 16px;background:#e2c17b18;border:1px solid #e2c17b66;color:#f5ead4;cursor:pointer}.err{height:20px;color:#d99b82;font-size:12px}.panel{margin-top:20px;background:#090302e8;border:1px solid #b9985566;padding:22px}.panel[hidden]{display:none}.panel label{display:block;margin:12px 0 6px;color:#e2c17b}.panel input{width:100%;padding:10px;background:#080302;border:1px solid #b998554d;color:#fff}.row{display:flex;gap:8px;margin-top:16px}.song{padding:12px 0;border-bottom:1px solid #b9985533;display:flex;justify-content:space-between;gap:12px;align-items:center}.status{font-size:12px;color:#d5c4a6;margin-top:12px}</style></head><body><div class="bg"></div><main><header><div><small>WONGMING EMPIRE</small><h1>皇家音樂廳</h1></div><a class="admin-link" href="index.html">返回</a></header><div id="lock" class="lock"><div class="lock-box"><h2>輸入管理密碼</h2><input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="管理密碼"><button id="unlock">進入編輯</button><div id="err" class="err"></div></div></div><section id="panel" class="panel" hidden><label>曲名</label><input id="t" placeholder="例如：天命所歸典禮曲"><label>演出者／分類</label><input id="a"><label>YouTube 網址</label><input id="u" placeholder="https://www.youtube.com/watch?v=..."><div class="row"><button id="add">加入曲目</button><button id="reset">恢復預設</button></div><div id="status" class="status">正在讀取雲端資料……</div><hr><div id="list"></div></section></main><script>const CLOUD="https://ai-avatar-bot-two.vercel.app/api/locale?shrine=2";const D=[{title:"天命所歸典禮曲",artist:"",youtube:"https://www.youtube.com/watch?v=nJFxOGmXo3k"}];let s=[];const $=id=>document.getElementById(id);$("unlock").onclick=()=>{if($("pw").value==="1111"){$("lock").style.display="none";$("panel").hidden=false;load()}else{$("err").textContent="管理密碼錯誤";$("pw").select()}};$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("unlock").click()});async function load(){try{const r=await fetch(CLOUD,{cache:"no-store"});s=await r.json();if(!Array.isArray(s)||!s.length)s=D;render();$("status").textContent="已連線至雲端曲目資料"}catch{$("status").textContent="雲端讀取失敗，請稍後再試"}}async function save(){$("status").textContent="正在同步雲端……";try{const r=await fetch(CLOUD,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(s)});const x=await r.json();if(!r.ok||!x.ok)throw new Error();$("status").textContent="已儲存至雲端";render()}catch{$("status").textContent="儲存失敗，未寫入瀏覽器記憶"}}function render(){$("list").innerHTML="";s.forEach((x,i)=>{const d=document.createElement("div");d.className="song";const b=document.createElement("button");b.textContent="刪除";b.onclick=()=>{s.splice(i,1);save()};const info=document.createElement("span");info.innerHTML="<b></b><br><small></small>";info.querySelector("b").textContent=x.title;info.querySelector("small").textContent=x.youtube;d.append(info,b);$("list").append(d)})}$("add").onclick=()=>{if(!$("t").value.trim()||!$("u").value.trim())return alert("請填寫曲名與 YouTube 網址");s.push({title:$("t").value.trim(),artist:$("a").value.trim(),youtube:$("u").value.trim()});save();$("t").value="";$("a").value="";$("u").value=""};$("reset").onclick=()=>{s=[...D];save()};</script></body></html>
